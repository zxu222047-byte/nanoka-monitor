name: Nanoka update monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email instead of checking the website'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nanoka-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monitor or test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python monitor.py --test-email
          else
            python monitor.py
          fi
      - name: Persist baseline and confirmation state
        if: success()
        run: |
          if [ -f .monitor/state.json ]; then
            git add -- .monitor/state.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update monitor state'
              git push
            fi
          fi
